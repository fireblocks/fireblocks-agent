{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fireblocks-agent.fullname" . }}
  labels:
    {{- include "fireblocks-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fireblocks-agent.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  # The Agent accepts no inbound connections.
  ingress: []
  egress:
    {{- include "fireblocks-agent.dnsEgress" . | nindent 4 }}
    # The Customer Server.
    - to:
        {{- with .Values.networkPolicy.customerServerPeers }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: {{ include "fireblocks-agent.customerServerPort" . }}
          protocol: TCP
    {{- include "fireblocks-agent.fireblocksEgress" . | nindent 4 }}
{{- end }}
{{- if and .Values.pairing.enabled .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fireblocks-agent.fullname" . }}-pairing
  labels:
    {{- include "fireblocks-agent.pairingLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fireblocks-agent.name" . }}-pairing
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    {{- include "fireblocks-agent.dnsEgress" . | nindent 4 }}
    {{- include "fireblocks-agent.fireblocksEgress" . | nindent 4 }}
    # The Kubernetes API, for writing the Secret (OpenShift serves it on 6443, managed clusters such
    # as GKE on 443).
    - ports:
        - port: 6443
          protocol: TCP
        - port: 443
          protocol: TCP
      {{- with .Values.pairing.apiServerCidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
{{- end }}
