# nginx front-end for the OPTIONAL cluster mode of the example customer server
# (used only by docker-compose.cluster.yml; the default single-process setup in
# docker-compose.yml does not involve nginx at all).
#
# Routing:
#   /api/hsm/  ->  customer-server-primary  (single writer: key generation)
#   /api/      ->  customer-server-signer   (replica pool: signing, round-robin)

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Perf: request logging off so nginx logging never becomes the bottleneck.
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Docker's embedded DNS server. A short re-resolve TTL combined with a
    # VARIABLE proxy_pass below forces per-request name resolution, so nginx
    # round-robins across ALL signer replicas — including replicas added by
    # `--scale` after nginx started. A literal proxy_pass hostname would be
    # resolved once at startup and pin all traffic to a single replica.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        # Default: plain HTTP entry point on port 5000 (published by
        # docker-compose.cluster.yml as host port 5000).
        listen 5000;

        # --- Optional TLS termination (cluster-mode SSL) --------------------
        # In cluster mode TLS is terminated HERE, not in the Node backends:
        # the backends always run plain HTTP on the internal Docker network
        # and are never exposed on the host. To enable TLS:
        #   1. comment out the `listen 5000;` line above,
        #   2. uncomment the three lines below,
        #   3. uncomment the cert/key mounts on the nginx service in
        #      docker-compose.cluster.yml.
        # The Agent then uses https:// in CUSTOMER_SERVER_URL and, for
        # self-signed certificates, the same SSL_CERT_PATH setting described
        # in README.md.
        #
        # listen 5000 ssl;
        # ssl_certificate     /etc/nginx/certs/self-signed-cert.txt;
        # ssl_certificate_key /etc/nginx/certs/priv-key.txt;
        # --------------------------------------------------------------------

        proxy_http_version 1.1;

        # Key generation -> the single "primary" backend. Generating keys
        # WRITES to the shared SoftHSM token; concurrent key generation from
        # multiple processes races on the token file, so it is pinned to one
        # process. Longest-prefix match: /api/hsm/ wins over /api/ below.
        location /api/hsm/ {
            set $keygen_backend customer-server-primary;
            proxy_pass http://$keygen_backend:5000;
        }

        # Everything else (/api/messagesToSign, /api/messagesStatus,
        # /api/signRequest/..., /api/signAllPendingMessages) -> the signer
        # pool. Signing only READS the token, which SoftHSM's file-backed
        # object store supports concurrently across processes.
        location /api/ {
            set $signer_backend customer-server-signer;
            proxy_pass http://$signer_backend:5000;
        }

        # Liveness probe for nginx itself (does not touch the backends).
        location = /healthz {
            return 200 "ok\n";
        }
    }
}
